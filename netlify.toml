[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# L'ordre compte : /api/* doit passer AVANT le catch-all /*.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
